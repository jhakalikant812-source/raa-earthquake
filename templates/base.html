<!DOCTYPE html>
<html>
<head>
    <title>Raa Earthquake</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="google-site-verification" content="aKhYEG-Q-t5PaNZiKUb1DyFniY4j3ITzPq1hrzK_0Fg" />



<meta name="description" content="RAA Earthquake - Real time earthquake alerts and safety guide for India and world.">
<meta name="keywords" content="RAA Earthquake, earthquake alert app, India earthquake, live earthquake data">
<meta name="author" content="Raa Earthquake">
<meta name="robots" content="index, follow">





    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* ================= TOP BAR ================= */
        .topbar {
            background: #111;
            color: white;
            padding: 12px 15px;
            display: flex;
            align-items: center;
        }

        .menu-toggle {
            font-size: 22px;
            cursor: pointer;
            margin-right: 15px;
        }

        .topbar-title {
            font-weight: bold;
        }

        /* ================= SIDEBAR ================= */
        .sidebar {
            position: fixed;
            left: -250px;   /* Hidden by default */
            top: 0;
            width: 230px;
            height: 100%;
            background: #111;
            padding: 20px;
            color: white;
            transition: 0.3s;
            z-index: 1000;
        }

        .sidebar.active {
            left: 0;   /* Show when active */
        }

        .menu-box {
            background: #222;
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            transition: 0.3s;
        }

        .menu-box:hover {
            background: #333;
        }

        .menu-box a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            display: block;
        }

        /* ================= CONTENT ================= */
        .content {
            padding: 20px;
        }

        /* Dark overlay when menu open */
        .overlay {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            top: 0;
            left: 0;
            z-index: 500;
        }

        .overlay.active {
            display: block;
        }

    </style>
</head>

<body>

<!-- ================= TOP BAR ================= -->
<div class="topbar">
    <div class="menu-toggle" onclick="toggleMenu()">&#9776;</div>
    <div class="topbar-title">RAA EARTHQUAKE</div>
</div>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar" id="sidebar">

    <div class="menu-box">
        <a href="/">Home</a>
    </div>

    <div class="menu-box">
        <a href="/india">India</a>
    </div>

    <div class="menu-box">
        <a href="/world">World</a>
    </div>

    <div class="menu-box">
        <a href="/guide">Guide</a>
    </div>

    {% if session.get("user_id") %}
        <div class="menu-box">
            <a href="/account">Account</a>
        </div>

        <div class="menu-box">
            <a href="/logout">Logout</a>
        </div>
    {% else %}
        <div class="menu-box">
            <a href="/login">Login</a>
        </div>

        <div class="menu-box">
            <a href="/signup">Signup</a>
        </div>
    {% endif %}

    <!-- 🔒 ADMIN ONLY -->
    {% if session.get("user_email") in [
        "bharadwajrishav8434@gmail.com",
        "nitu9sharma9@gmail.com"
    ] %}
        <div class="menu-box">
            <a href="/rishav">Rishav</a>
        </div>
    {% endif %}

</div>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- ================= PAGE CONTENT ================= -->
<div class="content">
    {% block content %}
    {% endblock %}
</div>

<script>
function toggleMenu() {
    document.getElementById("sidebar").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
}
</script>

</body>
</html>
