<!DOCTYPE html>
<html>
<head>
    <title>Raa Earthquake</title>

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */
        .sidebar {
            width: 230px;
            background-color: #111;
            padding: 20px;
            color: white;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .menu-box {
            background: #222;
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            transition: 0.3s;
        }

        .menu-box:hover {
            background: #333;
        }

        .menu-box a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            display: block;
        }

        /* ================= CONTENT ================= */
        .content {
            flex: 1;
            padding: 25px;
        }

        /* ================= MOBILE VIEW ================= */
        @media (max-width: 768px) {

            .main-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }

            .menu-box {
                width: 45%;
                margin: 5px;
            }

            .content {
                padding: 15px;
            }
        }

    </style>
</head>

<body>

<div class="main-container">

    <!-- ================= SIDEBAR ================= -->
    <div class="sidebar">

        <h2>RAA EARTHQUAKE</h2>

        <div class="menu-box">
            <a href="/">Home</a>
        </div>

        <div class="menu-box">
            <a href="/india">India</a>
        </div>

        <div class="menu-box">
            <a href="/world">World</a>
        </div>

        <div class="menu-box">
            <a href="/guide">Guide</a>
        </div>

        {% if session.get("user_id") %}
            <div class="menu-box">
                <a href="/account">Account</a>
            </div>

            <div class="menu-box">
                <a href="/logout">Logout</a>
            </div>
        {% else %}
            <div class="menu-box">
                <a href="/login">Login</a>
            </div>

            <div class="menu-box">
                <a href="/signup">Signup</a>
            </div>
        {% endif %}

        <!-- ✅ RISHAV ADMIN OPTION (ONLY ADMIN CAN SEE) -->
        {% if session.get("user_email") in [
            "bharadwajrishav8434@gmail.com",
            "nitu9sharma9@gmail.com"
        ] %}
            <div class="menu-box">
                <a href="/rishav">Rishav</a>
            </div>
        {% endif %}

    </div>

    <!-- ================= PAGE CONTENT ================= -->
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</div>

</body>
</html>
