<!DOCTYPE html>
<html>
<head>
    <title>RAA EARTHQUAKE</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        /* ===== Layout ===== */
        .main-container {
            display: flex;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            width: 220px;
            background: #111;
            min-height: 100vh;
            padding-top: 20px;
        }

        .sidebar h2 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }

        .menu-box {
            background: #222;
            margin: 10px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            transition: 0.3s;
        }

        .menu-box a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            display: block;
        }

        .menu-box:hover {
            background: #ff4444;
        }

        /* ===== Content Area ===== */
        .content {
            flex: 1;
            padding: 30px;
        }

        .alerts-title {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .alert-box {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 6px solid red;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 6px;
        }

        .alert-header {
            font-weight: bold;
            color: red;
            margin-bottom: 8px;
        }

        .alert-message {
            font-size: 16px;
            margin-bottom: 6px;
        }

        .alert-time {
            font-size: 14px;
            color: gray;
        }

        footer {
            text-align: center;
            padding: 10px;
            background: #111;
            color: white;
        }

    </style>
</head>

<body>

<div class="main-container">

    <!-- ===== Sidebar ===== -->
    <div class="sidebar">

        <h2>RAA</h2>

        <div class="menu-box">
            <a href="/">🏠 Home</a>
        </div>

        <div class="menu-box">
            <a href="/india">🇮🇳 India</a>
        </div>

        <div class="menu-box">
            <a href="/world">🌍 World</a>
        </div>

        <div class="menu-box">
            <a href="/guide">📖 Guide</a>
        </div>

        <div class="menu-box">
            <a href="/account">👤 Account</a>
        </div>

        {% if session.get("user_email") in [
    "bharadwajrishav8434@gmail.com",
    "nitu9sharma9@gmail.com"
] %}
<div class="menu-box">
    <a href="/rishav">⭐ Rishav</a>
</div>
{% endif %}

        <div class="menu-box">
            <a href="/logout">🚪 Logout</a>
        </div>

    </div>

    <!-- ===== Page Content ===== -->
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</div>

<footer>
    © 2026 RAA Earthquake | Developed by Kalikant
</footer>

</body>
</html>
