{% extends "base.html" %}

{% block content %}

<style>
    .home-container {
        max-width: 800px;
        margin: auto;
    }

    .alerts-title {
        font-size: 28px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 25px;
    }

    .alert-box {
        background: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        border-left: 6px solid red;
        transition: 0.3s;
    }

    .alert-box:hover {
        transform: scale(1.02);
    }

    .alert-header {
        font-size: 18px;
        font-weight: bold;
        color: red;
        margin-bottom: 10px;
    }

    .alert-message {
        font-size: 16px;
        margin-bottom: 10px;
    }

    .alert-time {
        font-size: 14px;
        color: gray;
        text-align: right;
    }

    /* Mobile Friendly */
    @media (max-width: 768px) {
        .alert-box {
            padding: 15px;
        }

        .alerts-title {
            font-size: 22px;
        }
    }
</style>

<div class="home-container">

    <div class="alerts-title">
        🚨 Earthquake Alerts
    </div>

    {% if alerts %}
        {% for alert in alerts %}
            <div class="alert-box">

                <div class="alert-header">
                    Earthquake Alert
                </div>

                <div class="alert-message">
                    {{ alert.message }}
                </div>

                <div class="alert-time">
                    {{ alert.ist_time.strftime("%d %B %Y | %I:%M %p") }}
                </div>

            </div>
        {% endfor %}
    {% else %}
        <div class="alert-box" style="text-align:center;">
            No alerts available.
        </div>
    {% endif %}

</div>

{% endblock %}
